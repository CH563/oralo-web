<figure class="floating-preview">
      <div class="stream-scene">
        <img class="stream-photo" src="/assets/creator-live-480.webp" srcset="/assets/creator-live-480.webp 480w, /assets/creator-live-960.webp 960w" sizes="(max-width: 460px) calc(100vw - 40px), (max-width: 700px) 420px, (max-width: 1000px) calc((100vw - 104px) / 2), 420px" width="1086" height="1448" loading="lazy" decoding="async" alt="{{floatingAlt}}" data-i18n-alt="{{floatingAlt}}">
        <div class="stream-topline"><span class="stream-live"><span aria-hidden="true"></span><span data-i18n="streamLive">{{streamLive}}</span></span><span class="stream-time">12:48</span></div>
        <div class="stream-prompt">
          <div class="stream-prompt-label"><span class="stream-pip-icon" aria-hidden="true"></span><span data-i18n="streamPromptLabel">{{streamPromptLabel}}</span></div>
          <div class="stream-prompt-text"><p class="stream-prompt-previous" data-i18n="streamScriptPrevious">{{streamScriptPrevious}}</p><p class="stream-prompt-current" data-i18n="streamScriptCurrent">{{streamScriptCurrent}}</p><p class="stream-prompt-next" data-i18n="streamScriptNext">{{streamScriptNext}}</p></div>
        </div>
        <div class="stream-bottom" aria-hidden="true"><span class="stream-comment" data-i18n="streamComment">{{streamComment}}</span><span class="stream-heart">♡</span><span class="stream-more">···</span></div>
      </div>
      <figcaption class="screenshot-note" data-i18n="floatingCaption">{{floatingCaption}}</figcaption>
    </figure>
